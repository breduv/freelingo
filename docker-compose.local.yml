# Merge with docker-compose.yml. Requires Docker Compose 2.24.4+ for !override.
name: freelingo-fork

services:
  postgres:
    container_name: !reset null
    volumes: !override
      - postgres-local:/var/lib/postgresql/data

  redis:
    container_name: !reset null
    volumes: !override
      - redis-local:/data

  backend:
    container_name: !reset null
    image: freelingo-fork-backend:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.local
      target: backend
    command: >-
      sh -c "cd /tmp && PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_BASE_URL: http://localhost:3000
      CHATGPT_MODEL: ${CHATGPT_MODEL:-gpt-6-luna}
      CHATGPT_REDIRECT_URI: http://127.0.0.1:3000/auth/callback
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      LLM_CONFIG_PATH: /data/llm/settings.json
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      STT_BASE_URL: http://gateway:9000
    volumes: !override
      - avatars-local:/app/avatars
      - audio-local:/data/audio
      - previews-local:/app/tts_previews
      - llm-local:/data/llm

  frontend:
    container_name: !reset null
    image: freelingo-fork-frontend:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.local
      target: frontend
    ports: !reset []

  kokoro:
    container_name: !reset null
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest

  whisper:
    container_name: !reset null

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./deploy/local.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-local:
  redis-local:
  avatars-local:
  audio-local:
  previews-local:
  llm-local:
