resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1860s;
    proxy_send_timeout 1860s;

    location = /llm/auth/start {
        access_log off;
        proxy_pass $backend;
    }
    location = /auth/callback {
        access_log off;
        proxy_pass $backend;
    }
    location = /llm {
        proxy_pass $backend;
    }
    location = /health {
        proxy_pass $backend;
    }
    location /api/ {
        proxy_pass $backend;
    }
    location /ws/ {
        proxy_pass $backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
    location / {
        proxy_pass $frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

# Whisper redirects / to /docs; FreeLingo's readiness check expects HTTP 200.
server {
    listen 9000;
    set $whisper http://whisper:9000;
    client_max_body_size 50m;
    proxy_read_timeout 65s;
    location = / {
        proxy_pass $whisper/docs;
    }
    location / {
        proxy_pass $whisper;
    }
}
